name: PHP CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  PHP_VERSION: '8.2'

jobs:
  lint:
    name: PHP Linting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Lint PHP files
        run: |
          find . -name "*.php" -print0 | xargs -0 -n1 php -l
          echo "✓ All PHP files passed linting"

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: phpcs, phpstan

      - name: Install dependencies
        run: |
          if [ -f composer.json ]; then
            composer install --no-interaction --prefer-dist || echo "Composer install failed, continuing with tools..."
          else
            echo "No composer.json found, skipping composer install"
          fi

      - name: Run PHPCS
        run: |
          if [ -f phpcs.xml ]; then
            phpcs --standard=phpcs.xml src/ public/
          else
            phpcs --standard=PSR12 src/ public/ || echo "PHPCS check completed"
          fi

      - name: Run PHPStan
        run: |
          if [ -f phpstan.neon ]; then
            phpstan analyse || echo "PHPStan analysis completed"
          else
            phpstan analyse src/ --level=5 || echo "PHPStan analysis completed"
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: echocare_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mysql, pdo_mysql
          tools: phpunit

      - name: Create test environment
        run: |
          cp .env.example .env.test || true
          php -v
          mysql -h 127.0.0.1 -u root -proot echocare_test < database/schema.sql || true

      - name: Run unit tests
        run: |
          phpunit || true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Check for hardcoded credentials
        run: |
          echo "Scanning for hardcoded credentials..."
          grep -r "password.*=" src/ --include="*.php" | grep -v "password_" | grep -v "PASSWORD" | grep -v "TODO" || echo "No obvious hardcoded credentials found"
          grep -r "apikey\|api_key" src/ --include="*.php" || echo "No obvious API keys found"
          echo "✓ Credential scan completed"

      - name: Scan PHP files for security issues
        run: |
          echo "Scanning for common security patterns..."
          # Check for unescaped output
          grep -r "echo \$_" src/ --include="*.php" || echo "No unescaped echo found"
          # Check for SQL injection patterns
          grep -r "mysqli_query.*\$" src/ --include="*.php" || echo "No obvious SQL injection patterns"
          echo "✓ Security pattern scan completed"

  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: [lint, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Create build artifact
        run: |
          mkdir -p build
          cp -r src/ public/ database/ build/
          zip -r echocare-${{ github.sha }}.zip build/
          echo "Build completed successfully"

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: echocare-build
          path: echocare-${{ github.sha }}.zip
          retention-days: 30

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [lint, security]
    if: always()

    steps:
      - name: Check job statuses
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Security: ${{ needs.security.result }}"
          if [ "${{ needs.lint.result }}" = "failure" ] || [ "${{ needs.security.result }}" = "failure" ]; then
            echo "❌ Pipeline failed"
            exit 1
          fi
          echo "✅ Pipeline passed"
